# ==============================================================================
# Prometheus Scrape Configuration for NetOps Sentinel
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'netops_sentinel_api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000', 'localhost:3000']
        labels:
          environment: 'production'
          datacenter: 'us-east-1'
          cluster: 'akamai-edge-sentinel'
