name: NetOps Sentinel CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Backend Tests, Diagnostics & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Python Unit & Failure-Injection Tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Bash Diagnostic Scripts
        run: |
          chmod +x scripts/*.sh
          ./scripts/diagnostics.sh json > /dev/null
          echo "Bash diagnostic scripts syntax & execution validated successfully."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint and Type Check Frontend
        run: npm run lint

      - name: Build React Dashboard
        run: npm run build

      - name: Validate Docker Compose Configuration
        run: docker compose config
